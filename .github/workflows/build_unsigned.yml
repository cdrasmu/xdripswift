name: Build xDrip4iOS unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout xDrip4iOS
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: bundle install

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace xdrip.xcworkspace \
            -scheme xdrip \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/xDrip4iOS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/xDrip4iOS.xcarchive/Products/Applications/"*.app \
                "$RUNNER_TEMP/Payload/"
          mkdir -p "$RUNNER_TEMP/IPA"
          cd "$RUNNER_TEMP"
          zip -r "$RUNNER_TEMP/IPA/xDrip4iOS-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: xDrip4iOS-unsigned
          path: ${{ runner.temp }}/IPA/xDrip4iOS-unsigned.ipa
